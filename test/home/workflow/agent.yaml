# Agent seams: invoke turns, in-session continuity, and share_session
# inheritance.
procedures:
  agent:
    access: public
    returns: "Dictionary<String, Any>"
    failing: anything
    body:
      - let: outer
        value:
          call:
            procedure: Forge.invoke
            arguments:
              - claude
              - null
              - null
              - null
              - null
              - null
              - null
              - closure:
                  returns: "Dictionary<String, Any>"
                  failing: anything
                  body:
                    - let: first
                      value: { call: { procedure: Forge.agent, arguments: [ ping one ] } }
                    - let: second
                      value: { call: { procedure: Forge.agent, arguments: [ ping two ] } }
                    - let: nested
                      value:
                        call:
                          procedure: Forge.invoke
                          arguments:
                            - claude
                            - null
                            - null
                            - null
                            - null
                            - true
                            - null
                            - closure:
                                returns: String
                                failing: anything
                                result: { call: { procedure: Forge.agent, arguments: [ ping three ] } }
                  result:
                    dictionary:
                      - [first, { ref: first }]
                      - [second, { ref: second }]
                      - [inherited, { ref: nested }]
    result: { dictionary: [ [result, { ref: outer }] ] }
