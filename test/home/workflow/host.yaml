description: Host seams — shell and resource in one pass
inputs:
  name:
    type: string
    default: e2e
steps:
- id: shout
  shell:
    command:
    - /bin/sh
    - -c
    - printf 'shell:%s' "$1"
    - _
    - { ref: inputs.name }
    timeout: 30
- id: letter
  resource:
    content: greeting.txt
    inputs:
      name: { ref: inputs.name }
- id: script
  resource:
    path: script/stamp.sh
- id: stamped
  shell:
    command:
    - /bin/sh
    - { ref: script }
    - { ref: inputs.name }
- id: fragile
  shell:
    command: [/bin/sh, -c, "echo warned >&2; exit 7"]
  rescue:
  - id: excuse
    value:
      format: "rescued(${code}): ${said}"
      with:
        code: { ref: fragile.exit_code }
        said: { ref: fragile.stderr }
outputs:
  shell: { ref: shout }
  resource: { ref: letter }
  stamped: { ref: stamped }
  rescued: { ref: fragile }
