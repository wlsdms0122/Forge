# Host seams: shell and resource in one pass.
procedures:
  host:
    access: public
    parameters: [ name: String? ]
    returns: "Dictionary<String, Any>"
    failing: [cast_refused, nonzero_exit, timeout]
    body:
      - var: who
        type: String
        value: e2e
      - value:
          conditional:
            when: { present: { ref: name } }
            then: [ { set: who, value: { as: { of: { ref: name }, type: String } } } ]
      - let: shout
        value:
          call:
            procedure: Forge.Native.shell
            arguments: [ [ /bin/sh, -c, "printf 'shell:%s' \"$1\"", _, { ref: who } ], null, null, null, 30 ]
      - let: letter
        value: { call: { procedure: Forge.Native.resource, arguments: [ greeting.txt, { dictionary: [ [name, { ref: who }] ] } ] } }
      - let: script
        value: { call: { procedure: Forge.Native.locate, arguments: [ script/stamp.sh ] } }
      - let: stamped
        value: { call: { procedure: Forge.Native.shell, arguments: [ [ /bin/sh, { ref: script }, { ref: who } ], null, null, null, null ] } }
      - var: rescued
        type: String
        value: ""
      - let: fragile
        value:
          attempt:
            body:
              - value: { call: { procedure: Forge.Native.shell, arguments: [ [ /bin/sh, -c, "echo warned >&2; exit 7" ], null, null, null, null ] } }
            rescue:
              - set: rescued
                value:
                  format: "rescued(${code}): ${said}"
                  with:
                    code: { ref: 'fragile.details["exit_code"]' }
                    said: { ref: 'fragile.details["stderr"]' }
    result:
      dictionary:
        - [shell, { ref: shout }]
        - [resource, { ref: letter }]
        - [stamped, { ref: stamped }]
        - [rescued, { ref: rescued }]
