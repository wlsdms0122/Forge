name: host
procedures:
  host:
    description: Host seams — shell and resource in one pass
    parameters:
      name:
        type: string
        default: e2e
    body:
    - id: shout
      shell:
        command:
        - /bin/sh
        - -c
        - printf 'shell:%s' "$1"
        - _
        - { ref: name }
        timeout: 30
    - id: letter
      resource:
        content: greeting.txt
        inputs:
          name: { ref: name }
    - id: script
      resource:
        path: script/stamp.sh
    - id: stamped
      shell:
        command:
        - /bin/sh
        - { ref: script }
        - { ref: name }
    - id: fragile
      attempt:
        body:
        - id: attempted
          shell:
            command: [/bin/sh, -c, "echo warned >&2; exit 7"]
        rescue:
          body:
          - id: excuse
            value:
              format: "rescued(${code}): ${said}"
              with:
                code: { ref: fragile.exit_code }
                said: { ref: fragile.stderr }
          result: { ref: excuse }
    result:
      shell: { ref: shout }
      resource: { ref: letter }
      stamped: { ref: stamped }
      rescued: { ref: fragile }
