name: kernel
procedures:
  kernel:
    description: Kernel language tour — every control-flow feature in one shallow pass
    parameters:
      who:
        type: string
        default: world
      mode:
        type: string
        oneOf: [a, b]
        default: a
      items:
        type: array
        default: [one, two]
    body:
    - id: greet
      value: { format: "hello, ${name}", with: { name: { ref: who } } }
    - id: quoted
      value: { value: { ref: kept-as-data } }
    - id: pick
      branch:
        when:
          { of: { ref: mode }, is: a }
        then:
          body:
          - id: chosen
            value: took-a
          result: { ref: chosen }
        else:
          body:
          - id: chosen
            value: took-b
          result: { ref: chosen }
    - id: gate
      loop:
        where:
          { of: { ref: "gate.index" }, is_not: 2 }
        body:
        - id: latest
          value: { ref: gate.index }
        guard: 5
        result: { ref: latest }
    - id: walk
      each:
        in: { ref: items }
        body:
        - id: tagged
          value:
            format: "${index}:${item}"
            with:
              index: { ref: walk.index }
              item: { ref: walk.item }
        result: { ref: tagged }
    - id: par
      parallel:
        do:
        - id: left
          value: 1
        - id: right
          value: 2
    - id: blk
      group:
        body:
        - id: inner
          value: grouped
        result: { ref: inner }
    - id: caught
      attempt:
        body:
        - id: bailing
          abort: bail out
        rescue:
          body:
          - id: recovery
            value: rescued
          result: { ref: recovery }
    - id: called
      call:
        procedure: child
        arguments:
          tag: from-use
    result:
      greeting: { ref: greet }
      quoted: { ref: quoted }
      branch: { ref: pick }
      loop: { ref: gate }
      walk: { ref: walk }
      parallel: { ref: par }
      group: { ref: blk }
      rescued: { ref: caught }
      used: { ref: called.tag_out }
