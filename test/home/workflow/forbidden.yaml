# Policy gate: a dispatch outside the allow list must fail, and rescue must not
# swallow it.
procedures:
  forbidden:
    access: public
    returns: "Dictionary<String, Any>"
    body:
      - var: blocked
        type: Any
        value: null
      - let: attempted
        value:
          attempt:
            body:
              - set: blocked
                value: { call: { procedure: dispatch, arguments: { name: kernel, timeout: 60 } } }
            rescue:
              - set: blocked
                value: should-not-swallow
    result: { dictionary: [ [result, { ref: blocked }] ] }
