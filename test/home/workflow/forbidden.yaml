name: forbidden
procedures:
  forbidden:
    description: Policy gate — a dispatch outside the allow list must fail, and rescue must not swallow it
    body:
    - id: blocked
      attempt:
        body:
        - id: attempted
          dispatch:
            name: composer
            timeout: 60
        rescue:
          body:
          - id: swallow
            value: should-not-swallow
          result: { ref: swallow }
    result:
      result: { ref: blocked }
