# Cross-run dispatch: parent spawns a child run through the policy gate.
procedures:
  parent:
    access: public
    returns: "Dictionary<String, Any>"
    failing: [child_run_failed, timeout]
    body:
      - let: fan
        value: { call: { procedure: Forge.Native.dispatch, arguments: [ child, { dictionary: [ [tag, from-dispatch] ] }, 60 ] } }
    result: { dictionary: [ [child, { ref: fan }] ] }
