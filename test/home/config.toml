# e2e instance home — release-gate scenario. The runner copies this directory
# to a throwaway instance home and replaces __AGENT_STUB__ with the absolute
# path of E2E/agent-stub before booting the daemon under test.
[directory]
workflow = "workflow"
resource = "resource"
policy = "policy"

[log]
jsonl = "log/forge.log.jsonl"
error = "log/error.log"

[pool]
maximum_concurrent_steps = 4

[provider.claude]
kind = "claude-cli"
executable = "__AGENT_STUB__"

[service.heartbeat]
command = ["/bin/sh", "-c", "sleep 300"]
